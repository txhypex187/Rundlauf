<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rundlauf">
<title>Rundlauf 3000 m</title>
<style>
:root{--bg:#EEF1EC;--ink:#14213D;--mut:#5B6577;--card:#fff;--ok:#0B7A4B;--bad:#C0392B;--btn:#14213D;--btnt:#fff;--line:#D5DAD2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--ink:#EDF1F7;--mut:#9AA6BA;--card:#17233A;--ok:#4FD08A;--bad:#FF7B6B;--btn:#EDF1F7;--btnt:#0E1626;--line:#2A3956;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:8px 12px;max-width:560px;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.time{font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:center;font-size:min(16vw,64px)}
.cd{text-align:center;font-size:14px;color:var(--mut);min-height:18px;font-variant-numeric:tabular-nums}.cd.over{color:var(--bad);font-weight:700}
.sub{text-align:center;color:var(--mut);font-size:12px}
.dev{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.dev b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.dev span{font-size:13px;color:var(--mut)}
.ok b{color:var(--ok)}.bad b{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.c small{display:block;color:var(--mut);font-size:11px}
.c strong{font-size:15px;font-variant-numeric:tabular-nums}
#tap{flex:1;min-height:110px;border:0;border-radius:20px;background:var(--btn);color:var(--btnt);font-size:9vw;font-size:min(9vw,44px);font-weight:800;line-height:1.2}
#tap small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:6px}
#tap:active{transform:scale(.98)}
.row{display:flex;gap:8px}
.row button{flex:1;padding:10px;font-size:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#hp{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));font-size:14px;z-index:5}
#hp[hidden]{display:none}
#hp h2{margin:0 0 8px;font-size:18px}
.h{padding:6px 0;border-top:1px solid var(--line);margin-top:6px;font-variant-numeric:tabular-nums}
.h small{color:var(--mut);display:block}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
</style>
</head>
<body>
<div class="time" id="time">0:00</div>
<div class="cd" id="cd"></div>
<div class="sub" id="sub"></div>
<div class="dev" id="dev"><b id="devv">–</b><span id="devl">Tippe auf Start, sobald du losläufst</span></div>
<div class="grid">
  <div class="c"><small>Letzte Runde</small><strong id="last">–</strong></div>
  <div class="c"><small>Pace letzte Runde</small><strong id="lpace">–</strong></div>
  <div class="c"><small>Trend zur Vorrunde</small><strong id="trend">–</strong></div>
  <div class="c"><small>Ø Pace bisher</small><strong id="apace">–</strong></div>
  <div class="c"><small id="projl">Zeitlimit Runde 1</small><strong id="proj">–</strong></div>
  <div class="c"><small>Noch nötig</small><strong id="need">–</strong></div>
</div>
<button id="tap" type="button"></button>
<div class="row"><button id="undo" type="button">Rückgängig</button><button id="reset" type="button">Neu starten</button><button id="hopen" type="button">Verlauf</button></div>
<div id="hp" hidden><h2>Verlauf</h2><div id="hist"></div><div class="row" style="margin-top:12px"><button id="hclose" type="button">Schließen</button></div></div>
<script>
const LAPM=400, TARGET=1070, UNITS=[1,1,1,1,1,1,1,.5], TOTAL=7.5, LAP=TARGET/TOTAL;
const $=id=>document.getElementById(id);
let S={start:null,laps:[],done:false,doneAt:0}, wl=null;
try{const x=JSON.parse(localStorage.getItem('rl_state'));if(x&&x.laps)S=x}catch(e){}
const save=()=>{try{localStorage.setItem('rl_state',JSON.stringify(S))}catch(e){}};
const getH=()=>{try{return JSON.parse(localStorage.getItem('rl_hist'))||[]}catch(e){return[]}};
const setH=h=>{try{localStorage.setItem('rl_hist',JSON.stringify(h.slice(-30)))}catch(e){}};
const mmss=s=>{const t=Math.floor(Math.max(0,s));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const pace=s=>mmss(s)+' /km';
const sec=s=>s.toFixed(1).replace('.',',')+' s';
const sgn=x=>(x>0.05?'+':x<-0.05?'−':'±')+Math.abs(x).toFixed(1).replace('.',',')+' s';
const sumU=n=>UNITS.slice(0,n).reduce((a,b)=>a+b,0);
const lapT=i=>S.laps[i]-(i?S.laps[i-1]:0);
const elapsed=()=>S.done?S.laps[S.laps.length-1]:S.start?(Date.now()-S.start)/1000:0;

async function wake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unwake(){try{wl&&wl.release();wl=null}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.start&&!S.done)wake()});

function render(){
  const n=S.laps.length, dv=$('dev');
  dv.className='dev';
  tick();
  $('sub').textContent='Soll pro Runde: '+sec(LAP)+' ('+pace(LAP/(LAPM/1000))+') · Ziel '+mmss(TARGET);
  const tap=$('tap');
  if(!S.start){tap.innerHTML='Start<small>Tippen beim Losrennen</small>';}
  else if(S.done){tap.innerHTML='Neuer Lauf<small>Tippen zum Zurücksetzen</small>';}
  else{tap.innerHTML=(n===7?'Ziel (halbe Runde)':'Runde '+(n+1)+' fertig')+'<small>Runde '+(n+1)+' von 7,5</small>';}
  const k=Math.min(S.done?n:n+1,UNITS.length);
  $('projl').textContent=k===UNITS.length?'Zeitlimit Ziel':'Zeitlimit Runde '+k;
  $('proj').textContent=mmss(Math.ceil(TARGET*sumU(k)/TOTAL));
  if(n===0){
    $('devv').textContent='–';
    $('devl').textContent=S.start?'Läuft … erste Runde':'Tippe auf Start, sobald du losläufst';
    ['last','lpace','trend','apace','need'].forEach(k=>$(k).textContent='–');
  }else{
    const cu=sumU(n), last=S.laps[n-1], soll=TARGET*cu/TOTAL, d=last-soll;
    if(S.done){
      const f=last-TARGET;
      $('devv').textContent=mmss(last)+' ('+sgn(f)+')';
      $('devl').textContent=f<=0?'Geschafft, unter 17:50':'Zeit verpasst';
      dv.classList.add(f<=0?'ok':'bad');
    }else{
      $('devv').textContent=sgn(d);
      $('devl').textContent=d<=0?'vor dem Soll (nach Runde '+n+')':'hinter dem Soll (nach Runde '+n+')';
      dv.classList.add(d<=0?'ok':'bad');
    }
    const lt=lapT(n-1);
    $('last').textContent=sec(lt)+' ('+sgn(lt-LAP*UNITS[n-1])+')';
    $('lpace').textContent=pace(lt/(UNITS[n-1]*LAPM/1000));
    $('apace').textContent=pace(last/(cu*LAPM/1000));
    if(n>=2){const t=lt/UNITS[n-1]-lapT(n-2)/UNITS[n-2];$('trend').textContent=(t<-0.05?'schneller ':t>0.05?'langsamer ':'gleich ')+sgn(t);}
    else $('trend').textContent='–';
    const rem=TOTAL-cu;
    if(rem>0){const need=(TARGET-last)/rem;$('need').textContent=need>0?sec(need)+' · '+pace(need/(LAPM/1000)):'Zeit vorbei';}
    else $('need').textContent='–';
  }
  renderHist();
}
function renderHist(){
  const h=getH().slice().reverse().slice(0,8);
  $('hist').innerHTML=h.length?h.map(x=>'<div class="h">'+x.d+': '+mmss(x.t)+' ('+sgn(x.t-TARGET)+')<small>'+x.laps.map((c,i)=>sec(c-(i?x.laps[i-1]:0)).replace(' s','')).join(' · ')+'</small></div>').join(''):'<div class="h">Noch keine Läufe gespeichert.</div>';
}
function reset(){unwake();S={start:null,laps:[],done:false,doneAt:0};save();render();}
function tap(){
  const now=Date.now();
  if(S.done){if(now-S.doneAt>3000)reset();return;}
  if(!S.start){S.start=now;S.laps=[];wake();}
  else{
    const el=(now-S.start)/1000, prev=S.laps.length?S.laps[S.laps.length-1]:0;
    if(el-prev<5)return;
    S.laps.push(el);
    if(S.laps.length===UNITS.length){
      S.done=true;S.doneAt=now;unwake();
      const h=getH();h.push({d:new Date().toLocaleDateString('de-DE'),t:el,laps:S.laps.slice()});setH(h);
    }
  }
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  save();render();
}
function undo(){
  if(S.done){S.done=false;const h=getH();h.pop();setH(h);S.laps.pop();wake();}
  else if(S.laps.length)S.laps.pop();
  else if(S.start){S.start=null;unwake();}
  save();render();
}
$('tap').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
$('undo').addEventListener('click',undo);
$('reset').addEventListener('click',()=>{if(!S.start||S.done||confirm('Lauf wirklich verwerfen?'))reset()});
function tick(){
  $('time').textContent=mmss(elapsed());
  const cd=$('cd');
  if(S.start&&!S.done){
    const k=Math.min(S.laps.length+1,UNITS.length), r=Math.ceil(TARGET*sumU(k)/TOTAL)-elapsed();
    cd.className='cd'+(r<0?' over':'');
    cd.textContent=r>=0?'noch '+Math.ceil(r)+' s bis Limit':Math.ceil(-r)+' s über dem Limit';
  }else{cd.className='cd';cd.textContent='';}
}
setInterval(()=>{if(S.start&&!S.done)tick()},200);
$('hopen').addEventListener('click',()=>{$('hp').hidden=false});
$('hclose').addEventListener('click',()=>{$('hp').hidden=true});
if(S.start&&!S.done)wake();
render();
</script>
</body>
</html>
